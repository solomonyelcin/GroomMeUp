name: Daily picks
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 India time, every day
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect new picks from the public feeds
        run: node scripts/daily-digest.mjs
      - name: Save and publish when something changed
        run: |
          if [ -n "$(git status --porcelain content/daily/feed.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/daily/feed.json
            git commit -m "Daily picks: $(date -u +%F)"
            git push
            gh workflow run pages.yml --ref main
          else
            echo "Nothing new today."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
