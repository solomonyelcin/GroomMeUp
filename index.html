<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroomMeUp: interview prep workbench</title>
  <meta name="description" content="Free interview preparation workbench for senior .NET full stack engineers: question bank, quizzes, mock interviews, coding tests and evaluation.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151A33'/%3E%3Cpath d='M7 22h18M10 22v-4M14 22v-2M18 22v-4M22 22v-2' stroke='%23F5D547' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M9 12l7-5 7 5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#151A33">
  <script>
    /* apply the saved theme before first paint to avoid a flash */
    (function () {
      try {
        var t = localStorage.getItem("groommeup.theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "chalk";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/dashboard" aria-label="GroomMeUp home">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151A33"/><path d="M7 22h18M10 22v-4M14 22v-2M18 22v-4M22 22v-2" stroke="#F5D547" stroke-width="2" stroke-linecap="round"/><path d="M9 12l7-5 7 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>GroomMeUp</span>
      </a>
      <nav id="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
  <noscript>GroomMeUp needs JavaScript to run.</noscript>
</body>
</html>
